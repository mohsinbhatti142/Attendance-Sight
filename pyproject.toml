[project]
name = "attendance-sight-local-attendance"
version = "1.3.4"
description = "Attendance-Sight local attendance and face recognition desktop app"
readme = "README.md"
authors = [
    { name = "mohsinbhatti142", email = "mohsinsherazbhatti142@gmail.com" }
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite>=0.20.0",
    "insightface==0.7.3",
    "albumentations==1.3.1",
    "onnxruntime==1.20.1; sys_platform != 'win32'",
    "onnxruntime-gpu==1.20.0; sys_platform == 'win32'",
    "faiss-cpu==1.9.0.post1",
    "opencv-python==4.10.0.84",
    "numpy>=1.24.0,<2.0.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt>=4.1,<6",
    "pywebview==5.4",
    "pydantic[email]==2.10.5",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    "loguru==0.7.3",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "nvidia-cuda-runtime-cu12==12.6.77 ; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.6.4.1 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.3.0.75 ; sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.2.6.59 ; sys_platform == 'win32'",
]

[tool.uv.extra-build-dependencies]
insightface = ["setuptools", "wheel", "Cython==0.29.37"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"

[tool.uv.sources]
nvidia-cuda-runtime-cu12 = { index = "nvidia" }
nvidia-cublas-cu12 = { index = "nvidia" }
nvidia-cudnn-cu12 = { index = "nvidia" }
nvidia-cufft-cu12 = { index = "nvidia" }

[tool.uv]
package = false
